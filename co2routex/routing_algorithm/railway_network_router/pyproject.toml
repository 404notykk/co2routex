[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co2routex-railway-network-router"
version = "0.2.0"
description = "Railway station distance calculation and request processing for CO2RouteX"
requires-python = ">=3.10"
dependencies = [
  "geopandas>=1.0",
  "networkx>=3.2",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pyproj>=3.6",
  "PyYAML>=6.0",
  "shapely>=2.0",
]

[tool.setuptools.packages.find]
include = ["railway_router*"]

