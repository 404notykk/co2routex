# The supplied rows are illustrations, not the actual SINTEF scenarios.
input_path: examples/pipeline_scenarios.csv
route_metrics_sheet: pipeline_route_metrics
output_dir: outputs/pipeline_costs
output_workbook_name: pipeline_cost_results.xlsx

# approximation | benchmark | both
mode: both
coefficient_method: flow_range
annual_flow_column: annual_flow_t_per_year
input_row: null  # All eligible rows; --row N runs only data row N (first = 1).

# Defaults for rows without their own bounds. All bounds are tonnes CO2/year.
annual_flow_min_t_per_year: 500000.0
annual_flow_max_t_per_year: 2000000.0

# endpoints preserves the two-point method; intermediate points check its error.
# least_squares fits all fit_samples engineering evaluations instead.
fit_method: endpoints
fit_samples: 9
validation_samples: 8
fit_error_warning_percent: 10.0
write_xlsx: true           # One report workbook.
write_costed_input: true   # Original format: nine existing result fields plus four EUR 2024 fields.
write_csv: false           # Optional tables, off by default.
write_json: false          # Optional structured report, off by default.

# Existing engineering assumptions. A nonblank terrain column overrides terrain.
terrain: Onshore
timeframe: mid-term
electricity_price_eur_per_mwh: 60.0  # Scenario assumption in EUR 2021/MWh.
electricity_price_reference_year: 2021
operating_hours_per_year: 8000.0
p_inlet_bar: 10.0  # Feed pressure before initial compression.
p_outlet_bar: 70.0
discount_rate: 0.10
currency: EUR
cost_reference_year: 2021  # Internal data stay EUR 2021; new outputs also show EUR 2024.

# Default matches the updated container package / AdOpT-NET0 PPI snapshot.
# Factor = 1.208918925061937; 2021 Jan-Dec, 2024 Jan-Nov (December absent).
# A custom factor must be finite and positive and have a nonblank source below.
eur2021_to_eur2024_factor: null
eur2024_factor_source: null


# Costs use physical routed kilometres; no resistance multiplier is applied.
